<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Cinema Red / Crimson Gradient for V -->
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="45%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#8b0000" />
    </linearGradient>

    <!-- Cinema Cyan Play Accent Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Red Glow Filter -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#e50914" flood-opacity="0.5"/>
    </filter>

    <!-- Blue Glow Filter -->
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Modern Rounded Icon Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="12"/>

  <!-- Subtle Film Reel / Cinema Accent Dots -->
  <circle cx="100" cy="80" r="10" fill="#334155" opacity="0.6"/>
  <circle cx="412" cy="80" r="10" fill="#334155" opacity="0.6"/>
  <circle cx="100" cy="432" r="10" fill="#334155" opacity="0.6"/>
  <circle cx="412" cy="432" r="10" fill="#334155" opacity="0.6"/>

  <!-- Bold Glowing "V" Brand Shape -->
  <g filter="url(#redGlow)">
    <path d="M 115 130 L 195 130 L 256 315 L 317 130 L 397 130 L 295 400 L 217 400 Z" fill="url(#vGrad)" />
  </g>

  <!-- Glowing Cyan Movie Play Badge -->
  <g filter="url(#blueGlow)">
    <polygon points="236,212 236,292 308,252" fill="url(#playGrad)" />
  </g>
</svg>